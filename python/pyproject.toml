[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-starter"
version = "0.1.0"
description = "Enterprise Model Context Protocol (MCP) Server Starter in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
mcp-starter = "mcp_server_starter.server:main"
